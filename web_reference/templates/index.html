<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>AI-Based Disease Prediction</h3>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <h5 class="mb-3">Select Symptoms:</h5>

                            <!-- Search Box -->
                            <input type="text" class="form-control mb-3" id="searchInput" placeholder="Search symptoms...">

                            <div class="row">
                                {% for symptom in symptoms %}
                                    <div class="col-md-6 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="symptoms" value="{{ symptom }}" id="{{ symptom }}">
                                            <label class="form-check-label" for="{{ symptom }}">
                                                {{ symptom.replace('_', ' ').capitalize() }}
                                            </label>
                                        </div>
                                    </div>
                                {% endfor %}
                            </div>
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-success px-4">Predict Disease</button>
                            </div>
                        </form>

                        {% if prediction %}
                            <div class="alert alert-info text-center mt-4">
                                <strong>Predicted Disease:</strong> {{ prediction }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function () {
            let filter = this.value.toLowerCase();
            let checkboxes = document.querySelectorAll('.form-check');

            checkboxes.forEach(function (checkbox) {
                let label = checkbox.querySelector('label').innerText.toLowerCase();
                if (label.includes(filter)) {
                    checkbox.parentElement.style.display = '';
                } else {
                    checkbox.parentElement.style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
